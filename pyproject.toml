[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igagent"
version = "0.1.0"
description = "Autonomní agent pro Instagram: obsah, grafika, Reels, analýza a učení z výsledků"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.6.0",
    "Pillow>=10.3.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34.0"]
dev = ["pytest>=8.0"]

[project.scripts]
igagent = "igagent.cli:main"

[tool.setuptools.packages.find]
include = ["igagent*"]

[tool.setuptools.package-data]
igagent = ["store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
