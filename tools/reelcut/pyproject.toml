[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reelcut"
version = "0.1.0"
description = "Analyse a video and automatically cut the best moments into an Instagram Reel, keeping speech and interviews intact."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "static-ffmpeg>=3.0",
    "flask>=3.0",
]

[project.optional-dependencies]
vad = ["webrtcvad-wheels>=2.0.10"]
transcribe = ["faster-whisper>=1.0"]
all = ["webrtcvad-wheels>=2.0.10", "faster-whisper>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
reelcut = "reelcut.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reelcut*"]

[tool.setuptools.package-data]
reelcut = ["models/*.onnx", "models/LICENSE*", "webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
